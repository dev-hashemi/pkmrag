[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-orbit"
version = "0.1.0"
description = "Local-first Hybrid GraphRAG retrieval engine and MCP server for linked knowledge bases"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Project Orbit Contributors" }
]
dependencies = [
    "ladybug>=0.20.0",
    "lancedb>=0.38.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "types-pyyaml>=6.0.0",
]

[project.scripts]
orbit = "orbit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["ladybug.*", "lancedb.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
