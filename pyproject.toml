[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkmrag"
version = "0.9.0"
description = "Local-first Hybrid GraphRAG retrieval engine and MCP server for linked knowledge bases"

readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "PKMRAG Contributors" }
]
keywords = ["obsidian", "graphrag", "rag", "knowledge-graph", "lancedb", "mcp", "pkm", "vector-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "fastembed>=0.3.0",
    "httpx>=0.27.0",
    "ladybug>=0.20.0",
    "lancedb>=0.38.0",
    "mcp>=1.2.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/pkmrag/pkmrag"
Documentation = "https://github.com/pkmrag/pkmrag#readme"
Repository = "https://github.com/pkmrag/pkmrag"
Issues = "https://github.com/pkmrag/pkmrag/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.5.0",
    "types-pyyaml>=6.0.0",
]

[project.scripts]
pkmrag = "pkmrag.cli:app"
orbit = "pkmrag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pkmrag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["ladybug.*", "lancedb.*", "pyarrow.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-n", "4", "--dist", "loadgroup"]
