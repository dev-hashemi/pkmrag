name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest --cov=pkmrag --cov-report=term-missing
      - name: Run retrieval evaluation quality gates
        run: uv run pkmrag eval --min-mrr 0.80 --min-recall 0.80

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run mypy src tests

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
        working-directory: plugins/obsidian
      - name: Typecheck
        run: npm run typecheck
        working-directory: plugins/obsidian
      - name: Unit tests
        run: npm test
        working-directory: plugins/obsidian
      - name: Build bundle
        run: npm run build
        working-directory: plugins/obsidian
      - name: Verify bundled assets are in sync with the package copy
        run: |
          for f in main.js styles.css manifest.json; do
            diff "plugins/obsidian/$f" "src/pkmrag/plugin_assets/$f" \
              || { echo "::error::$f is out of sync between plugins/obsidian and src/pkmrag/plugin_assets"; exit 1; }
          done
          diff "plugins/obsidian/manifest.json" "manifest.json" \
            || { echo "::error::manifest.json at repository root is out of sync"; exit 1; }
